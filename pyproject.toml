[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcvd"
version = "0.3.0"
description = "Minecraft 鍘熺増涓嬭浇/瀹夎鍣細澶氭簮鑷姩閫夋簮锛堝畼鏂?/ BMCLAPI锛夈€佹柇鐐圭画浼犮€丼HA-1 鏍￠獙"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "huiyaoxingkong" }]
keywords = ["minecraft", "launcher", "downloader", "bmclapi", "vanilla"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/huiyaoxingkong/mc-vanilla-downloader"
Source = "https://github.com/huiyaoxingkong/mc-vanilla-downloader"

[project.scripts]
mcvd = "mcvd.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
