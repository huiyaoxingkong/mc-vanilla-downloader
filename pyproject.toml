[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcvd"
version = "0.1.0"
description = "Minecraft 原版下载/安装器：多源自动选源（官方 / BMCLAPI）、断点续传、SHA-1 校验"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "huiyaoxingkong" }]
keywords = ["minecraft", "launcher", "downloader", "bmclapi", "vanilla"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/huiyaoxingkong/mc-vanilla-downloader"
Source = "https://github.com/huiyaoxingkong/mc-vanilla-downloader"

[project.scripts]
mcvd = "mcvd.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
